# CONTOH workflow GitHub Actions (salin ke .github/workflows/integration.yml).
# Belum pernah dijalankan; sesuaikan versi Flutter/Java/API level.
name: integration-blackbox
on:
  workflow_dispatch:
  pull_request:

jobs:
  integration:
    runs-on: ubuntu-latest   # emulator Android butuh KVM (tersedia di ubuntu-latest)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pasang Firebase CLI
        run: npm install -g firebase-tools

      - name: Aktifkan KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Persiapan CI (google-services demo, cleartext, .env)
        run: bash integration_test/ci/prepare_ci.sh

      - name: Dependensi
        run: |
          flutter pub get
          # integration_test dibutuhkan; lihat README_integration.md bagian dev_dependencies.
          flutter pub add --dev 'integration_test:{"sdk":"flutter"}'

      - name: Jalankan integration test di emulator + Firebase Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: >
            firebase emulators:exec
            --project demo-cvm
            --config firebase.integration.json
            --only auth,firestore,storage
            "flutter test integration_test --machine > integration_result.jsonl"

      - name: Unggah hasil
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-result
          path: integration_result.jsonl
