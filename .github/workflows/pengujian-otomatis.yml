name: Pengujian Otomatis

# Dijalankan manual (Actions -> Pengujian Otomatis -> Run workflow)
# atau otomatis saat push ke main / cabang "pengujian-otomatis".
# Pengujian SELALU memakai konfigurasi palsu (demo-cvm), tidak memakai secret.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - pengujian-otomatis

permissions:
  contents: read

env:
  FIREBASE_PROJECT: demo-cvm        # proyek "demo-": emulator saja, tanpa kredensial
  FLUTTER_VERSION: "3.35.7"         # Dart 3.9.x; memenuhi pubspec.lock (Dart >=3.9.0, Flutter >=3.35.1)
  CI: "true"

jobs:
  # ---------------------------------------------------------------
  # 1. White Box: flutter test pada folder test/
  # ---------------------------------------------------------------
  white-box:
    name: White Box (flutter test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Siapkan konfigurasi palsu (.env, google-services, firebase_options)
        run: bash tools_ci/siapkan_rahasia.sh dummy

      - name: flutter pub get
        run: flutter pub get

      - name: flutter test (--machine)
        id: uji
        continue-on-error: true
        run: |
          mkdir -p tools_ci/out
          set +e
          flutter test --machine > tools_ci/out/white_box.jsonl 2> tools_ci/out/white_box.stderr.txt
          kode=$?
          echo "$kode" > tools_ci/out/white_box.exitcode
          echo "flutter test selesai dengan kode $kode"
          # Kegagalan uji dicatat di berkas hasil; langkah ini tidak menggagalkan job.
          exit 0

      - name: Unggah hasil White Box
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hasil-white-box
          path: tools_ci/out/white_box.*
          if-no-files-found: warn

  # ---------------------------------------------------------------
  # 2. Black Box sisi server: aturan Firestore/Storage + Cloud Functions
  # ---------------------------------------------------------------
  server-black-box:
    name: Black Box server (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"   # firebase-tools terbaru mewajibkan JDK >= 21 (Gradle 8.14 mendukung)

      - name: Pasang firebase-tools
        run: npm install -g firebase-tools

      - name: Cache unduhan emulator
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-v1

      - name: Pasang dependensi tests_ci
        continue-on-error: true
        run: |
          mkdir -p tests_ci/results
          for d in tests_ci/*/; do
            if [ -f "$d/package.json" ]; then
              echo "== npm install di $d"
              (cd "$d" && if [ -f package-lock.json ]; then npm ci; else npm install; fi)
            fi
          done

      - name: Uji aturan Firestore dan Storage
        continue-on-error: true
        run: |
          firebase emulators:exec --project "$FIREBASE_PROJECT" --only firestore,storage \
            "npm --prefix tests_ci/firestore_rules test"

      - name: Uji Cloud Functions (logika offline, firebase-admin di-mock; tanpa emulator)
        continue-on-error: true
        run: npm --prefix tests_ci/functions test

      - name: Unggah hasil JUnit server
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hasil-server-black-box
          path: tests_ci/results/
          if-no-files-found: warn

  # ---------------------------------------------------------------
  # 3. Black Box UI: integration_test di emulator Android
  # ---------------------------------------------------------------
  ui-black-box:
    name: Black Box UI (emulator Android)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true   # emulator bisa tidak stabil; jangan sembunyikan hasil job lain
    steps:
      - uses: actions/checkout@v4

      - name: Aktifkan KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"   # firebase-tools terbaru mewajibkan JDK >= 21 (Gradle 8.14 mendukung)

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Siapkan konfigurasi palsu (.env, google-services, firebase_options)
        run: bash tools_ci/siapkan_rahasia.sh dummy

      - name: Persiapan CI (google-services demo-cvm, cleartext 10.0.2.2, .env) - hanya di checkout CI
        run: bash integration_test/ci/prepare_ci.sh

      - name: Tambah dev_dependency integration_test (hanya di checkout CI) + flutter pub get
        run: bash tools_ci/tambah_dep_integration_test.sh

      - name: Pasang firebase-tools
        run: npm install -g firebase-tools

      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-v1

      - name: Cache AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api34-x86_64-pixel6-v2

      - name: Buat snapshot AVD (hanya bila cache kosong)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          profile: pixel_6          # layar ponsel umum (1080x2400)
          ram-size: 4096M
          heap-size: 576M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Snapshot AVD dibuat"

      - name: flutter test integration_test (dibungkus firebase emulators:exec)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          profile: pixel_6          # layar ponsel umum (1080x2400)
          ram-size: 4096M
          heap-size: 576M
          disk-size: 6000M
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash tools_ci/jalankan_integration.sh

      - name: Unggah hasil UI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hasil-ui-black-box
          path: tools_ci/out/ui_*
          if-no-files-found: warn

      - name: Unggah log emulator Firebase
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-emulator-firebase
          path: tools_ci/out/ui_firebase_emulator.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------
  # 4. Rekap: gabungkan semua hasil
  # ---------------------------------------------------------------
  rekap:
    name: Rekap hasil
    runs-on: ubuntu-latest
    needs: [white-box, server-black-box, ui-black-box]
    if: always()
    timeout-minutes: 10
    permissions:
      contents: write   # untuk menyimpan hasil ke cabang "hasil-pengujian"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pasang openpyxl
        run: pip install openpyxl

      - name: Unduh semua artefak
        uses: actions/download-artifact@v4
        with:
          path: tools_ci/in

      - name: Buat rekap.json (dan salinan Excel bila templat tersedia)
        run: |
          mkdir -p tools_ci/out
          args=(--input tools_ci/in --output tools_ci/out/rekap.json)
          # Letakkan Hasil_Pengujian.xlsx di tools_ci/templat/ bila ingin Excel terisi otomatis.
          if [ -f tools_ci/templat/Hasil_Pengujian.xlsx ]; then
            args+=(--excel tools_ci/templat/Hasil_Pengujian.xlsx --excel-out tools_ci/out/Hasil_Pengujian_terisi.xlsx)
          fi
          python tools_ci/parse_results.py "${args[@]}"

      - name: Ringkasan di halaman job
        if: always()
        run: |
          if [ -f tools_ci/out/rekap.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open("tools_ci/out/rekap.json", encoding="utf-8"))
          print("## Rekap Pengujian Otomatis\n")
          for k, v in r.get("ringkasan", {}).items():
              print(f"- **{k}**: {v}")
          PY
          fi

      - name: Unggah rekap
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rekap
          path: |
            tools_ci/out/rekap.json
            tools_ci/out/Hasil_Pengujian_terisi.xlsx
          if-no-files-found: warn

      - name: Simpan hasil ke cabang hasil-pengujian (bisa dibaca tanpa unduh artefak)
        if: always()
        run: |
          set -e
          tujuan="$RUNNER_TEMP/hasil"
          mkdir -p "$tujuan/mentah"
          cp tools_ci/out/rekap.json tools_ci/out/Hasil_Pengujian_terisi.xlsx "$tujuan/" 2>/dev/null || true
          cp -r tools_ci/in/. "$tujuan/mentah/" 2>/dev/null || true
          cd "$tujuan"
          {
            echo "# Hasil Pengujian Otomatis"
            echo
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Waktu (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > README.md
          git init -q -b hasil-pengujian
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Hasil pengujian run ${GITHUB_RUN_ID}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" hasil-pengujian
